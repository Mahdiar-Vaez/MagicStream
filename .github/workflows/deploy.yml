name: CI/CD Pipeline - MagicStream

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./Server/MagicStreamServer
          file: ./Server/MagicStreamServer/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/magic-stream-api:latest
            ${{ secrets.DOCKER_USERNAME }}/magic-stream-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./Client/magic-stream-client
          file: ./Client/magic-stream-client/Dockerfile.prod
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/magic-stream-client:latest
            ${{ secrets.DOCKER_USERNAME }}/magic-stream-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e
            echo "🚀 Connecting to server directory..."
            cd ${{ secrets.SERVER_DIR }}

            echo "📥 Fetching latest configs from Git..."
            git pull origin main

            echo "🐳 Pulling latest Docker images..."
            docker compose --env-file .env.prod -f docker-compose.prod.yaml pull

            echo "🔄 Recreating containers..."
            docker compose --env-file .env.prod -f docker-compose.prod.yaml up -d --remove-orphans

            echo "🧹 Cleaning up old unused images..."
            docker image prune -f

            echo "✅ Checking running containers status..."
            docker compose --env-file .env.prod -f docker-compose.prod.yaml ps
